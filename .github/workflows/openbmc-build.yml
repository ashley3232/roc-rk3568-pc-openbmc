name: OpenBMC Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake ninja-build g++ flex bison gperf python3 python3-pip python3-venv libffi-dev libssl-dev zlib1g-dev libncurses-dev bc cpio file unzip wget curl zstd xz-utils rsync uuid-dev libgpgme-dev swig
      
      - name: Setup OpenBMC
        run: |
          mkdir -p openbmc_workspace/build/conf
          
          cat > openbmc_workspace/build/conf/local.conf << 'CONF'
MACHINE ??= "roc-rk3568-pc"
DISTRO ?= "openbmc-rtk-ucmc"
CONF_VERSION = "2"
BB_NUMBER_THREADS = "8"
PARALLEL_MAKE = "-j 8"
CONF
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: openbmc-config
          path: openbmc_workspace/build/
          retention-days: 30
      
      - name: Complete
        run: echo "Build configuration ready!"
