name: OpenBMC Build Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-openbmc:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential cmake ninja-build g++ \
            flex bison gperf python3 python3-pip \
            python3-venv libffi-dev libssl-dev \
            zlib1g-dev libncurses-dev bc cpio \
            file unzip wget curl zstd xz-utils \
            rsync uuid-dev libgpgme-dev swig \
            python3-git tar gzip ccache
          pip3 install pyyaml
      
      - name: Clone OpenBMC
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/openbmc/openbmc.git
          cd openbmc
          
      - name: Setup build for QEMU (test build)
        run: |
          cd /tmp/openbmc
          export PATH="/usr/bin:$PATH"
          
          # Initialize build environment
          source openbmc-env
          
          # Use qemux86-64 as test platform (works out of box)
          TEMPLATECONF=meta-openbmc-machines/conf . ./oe-init-build-env build-qemu
          
          # Configure build
          echo 'MACHINE = "qemux86-64"' >> conf/local.conf
          echo 'BB_NUMBER_THREADS = "4"' >> conf/local.conf
          echo 'PARALLEL_MAKE = "-j 4"' >> conf/local.conf
          
      - name: Build firmware
        run: |
          cd /tmp/openbmc/build-qemu
          source openbmc-env
          bitbake obmc-phosphor-image 2>&1 | tail -50
          
      - name: Find built images
        run: |
          find /tmp/openbmc/build-qemu/tmp -name "*.ostree.tar" -o -name "*.ext4" -o -name "*.wic" 2>/dev/null | head -20
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openbmc-firmware
          path: |
            /tmp/openbmc/build-qemu/tmp/deploy/images/qemux86-64/*.ostree.tar
            /tmp/openbmc/build-qemu/tmp/deploy/images/qemux86-64/*.ext4
            /tmp/openbmc/build-qemu/tmp/deploy/images/qemux86-64/*.wic
          retention-days: 30
          
      - name: Success summary
        run: |
          echo "## OpenBMC Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Firmware built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built Images" >> $GITHUB_STEP_SUMMARY
          find /tmp/openbmc/build-qemu/tmp/deploy/images/qemux86-64 -type f \( -name "*.ostree.tar" -o -name "*.ext4" -o -name "*.wic" \) 2>/dev/null | while read f; do
            echo "- \`$f\`" >> $GITHUB_STEP_SUMMARY
          done
