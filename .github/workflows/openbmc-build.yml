name: OpenBMC Build Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  setup-build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential cmake ninja-build g++ \
            flex bison gperf python3 python3-pip \
            libffi-dev libssl-dev \
            zlib1g-dev libncurses-dev bc cpio \
            file unzip wget curl zstd xz-utils \
            rsync uuid-dev libgpgme-dev swig \
            tar gzip ccache gawk
          pip3 install pyyaml distro pysp

      - name: Clone OpenBMC repo
        run: |
          cd /tmp
          rm -rf openbmc
          git clone --depth 1 https://github.com/openbmc/openbmc.git
          cd openbmc
          ls -la

      - name: Setup OpenBMC build directory
        run: |
          cd /tmp/openbmc
          
          # Create build directory with proper setup
          mkdir -p build/conf
          
          # Create bblayers.conf
          cat > build/conf/bblayers.conf << 'BBLAYERS'
# POKY_BBLAYERS_CONF_VERSION is increased when building a new OpenEmbedded image
POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BSPDIR := "${@oe.utils.get_bsp_url(d, True)}"

BBLAYERS ?= " \\
  ${BSPDIR}/meta \\
  ${BSPDIR}/meta-poky \\
  ${BSPDIR}/meta-openbmc-bsp \\
  ${BSPDIR}/meta-raspberrypi \\
  "
BBLAYERS += " \\
  ${TOPDIR}/../meta-openembedded/meta-oe \\
  ${TOPDIR}/../meta-openembedded/meta-python \\
  ${TOPDIR}/../meta-openembedded/meta-networking \\
  ${TOPDIR}/../meta-openembedded/meta-filesystems \\
  "
BBLAYERS
          
          # Create local.conf for QEMU (test platform)
          cat > build/conf/local.conf << 'LOCALCONF'
MACHINE = "qemux86-64"
DISTRO = "poky"
ACCEPT_FSL_EULA = "1"
BB_THREADS = "4"
PARALLEL_MAKE = "-j 4"
BB_NUMBER_THREADS = "4"
SSTATE_DIR = "${TOPDIR}/../sstate-cache"
TMPDIR = "${TOPDIR}/tmp-${MACHINE}"
DL_DIR = "${TOPDIR}/../downloads"
LOCALCONF
          
          echo "Build configuration created!"
          ls -la build/conf/

      - name: Initialize build environment
        run: |
          cd /tmp/openbmc
          
          # Source OE environment
          export BASH_SOURCE=$(pwd)/oe-init-build-env
          source ./oe-init-build-env build
          
          # Verify setup
          echo "Build environment initialized!"
          pwd
          ls -la

      - name: Create build script
        run: |
          cat > /tmp/openbmc/build-firmware.sh << 'SCRIPT'
#!/bin/bash
set -e

cd /tmp/openbmc

# Source environment
source openbmc-env build

# Start build
echo "Starting OpenBMC firmware build..."
echo "This may take 2-4+ hours depending on hardware..."

# Build for QEMU first (faster)
bitbake obmc-phosphor-image

# Find output
echo ""
echo "Build complete! Output files:"
find tmp/deploy/images -type f \( -name "*.ostree*" -o -name "*.wic" -o -name "*.ext4" \) | head -20
SCRIPT
          
          chmod +x /tmp/openbmc/build-firmware.sh
          echo "Build script created!"

      - name: Package build environment
        run: |
          cd /tmp/openbmc
          
          # Create tarball of build setup
          tar -czf openbmc-build-setup.tar.gz \
            build/conf/bblayers.conf \
            build/conf/local.conf \
            build-firmware.sh \
            oe-init-build-env \
            openbmc-env
          
          ls -lh openbmc-build-setup.tar.gz
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openbmc-build-setup
          path: |
            /tmp/openbmc/openbmc-build-setup.tar.gz
            /tmp/openbmc/build/conf/bblayers.conf
            /tmp/openbmc/build/conf/local.conf
            /tmp/openbmc/build-firmware.sh
          retention-days: 30
          
      - name: Build Summary
        run: |
          echo "## OpenBMC Build Setup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build environment prepared!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Clone OpenBMC repository locally" >> $GITHUB_STEP_SUMMARY
          echo "3. Apply configuration and run build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: Full firmware build requires significant time (2-4+ hours) and disk space (50GB+)" >> $GITHUB_STEP_SUMMARY
