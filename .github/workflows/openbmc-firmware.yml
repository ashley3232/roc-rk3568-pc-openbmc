name: OpenBMC Firmware Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  prepare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential g++ python3 python3-pip libffi-dev libssl-dev zlib1g-dev libncurses-dev bc file unzip wget curl tar gzip ccache gawk
        pip3 install pyyaml distro
    
    - name: Clone OpenBMC
      run: |
        cd /tmp
        rm -rf openbmc-build
        git clone --depth 1 https://github.com/openbmc/openbmc.git openbmc-build
        cd openbmc-build
        ls -la
    
    - name: Create build config
      run: |
        cd /tmp/openbmc-build
        mkdir -p build/conf
        echo 'MACHINE = "qemux86-64"' > build/conf/local.conf
        echo 'DISTRO = "poky"' >> build/conf/local.conf
        echo 'BB_NUMBER_THREADS = "8"' >> build/conf/local.conf
        echo 'PARALLEL_MAKE = "-j 8"' >> build/conf/local.conf
    
    - name: Create firmware script
      run: |
        echo '#!/bin/bash' > /tmp/openbmc-build/build-firmware.sh
        echo 'cd /tmp/openbmc-build' >> /tmp/openbmc-build/build-firmware.sh
        echo 'source openbmc-env build' >> /tmp/openbmc-build/build-firmware.sh
        echo 'bitbake obmc-phosphor-image' >> /tmp/openbmc-build/build-firmware.sh
        chmod +x /tmp/openbmc-build/build-firmware.sh
    
    - name: Package artifacts
      run: |
        cd /tmp/openbmc-build
        tar -czvf /tmp/openbmc-firmware-build.tar.gz build/conf/local.conf build-firmware.sh
        ls -lh /tmp/openbmc-firmware-build.tar.gz
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: openbmc-firmware-build
        path: /tmp/openbmc-firmware-build.tar.gz
        retention-days: 30
    
    - name: Summary
      run: |
        echo "## OpenBMC Build Environment Ready" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "Download the artifact to get build configuration" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### To Build Firmware" >> $GITHUB_STEP_SUMMARY
        echo "1. Extract: tar -xzvf openbmc-firmware-build.tar.gz" >> $GITHUB_STEP_SUMMARY
        echo "2. Run: ./build-firmware.sh" >> $GITHUB_STEP_SUMMARY
